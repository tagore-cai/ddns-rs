[package]
name = "ddns-rs-web"
description = "Web UI and HTTP API for ddns-go"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ddns-rs-core = { path = "../ddns_rs_core" }
ddns-rs-providers = { path = "../ddns_rs_providers" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum = { version = "0.8", features = ["http2", "macros"] }
rust-embed = { version = "8", features = ["include-exclude", "debug-embed"] }
jiff.workspace = true
base64.workspace = true
hmac.workspace = true
sha2.workspace = true
rand.workspace = true

[dev-dependencies]
serde_yaml.workspace = true
