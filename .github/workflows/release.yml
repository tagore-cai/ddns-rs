name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: linux
            arch: x86_64
            ext: tar.gz
          - target: aarch64-unknown-linux-musl
            os: linux
            arch: arm64
            ext: tar.gz
          - target: armv7-unknown-linux-musleabihf
            os: linux
            arch: armv7
            ext: tar.gz
          - target: riscv64gc-unknown-linux-gnu
            os: linux
            arch: riscv64
            ext: tar.gz
          - target: x86_64-apple-darwin
            os: darwin
            arch: x86_64
            ext: tar.gz
          - target: aarch64-apple-darwin
            os: darwin
            arch: arm64
            ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows
            arch: x86_64
            ext: zip
          - target: aarch64-pc-windows-msvc
            os: windows
            arch: arm64
            ext: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux musl/arm)
        if: matrix.target == 'armv7-unknown-linux-musleabihf'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-arm-linux-gnueabihf

      - name: Build
        run: |
          cargo build --release --target ${{ matrix.target }} --bin ddns-rs
        env:
          CARGO_TARGET_DIR: target

      - name: Package
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          BIN="target/${{ matrix.target }}/release/ddns-rs"
          BASE="ddns-rs_${VERSION}_${{ matrix.os }}_${{ matrix.arch }}"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            cd target/${{ matrix.target }}/release
            zip "../../../${BASE}.zip" ddns-rs
            cd -
          else
            tar -C target/${{ matrix.target }}/release -czf "${BASE}.tar.gz" ddns-rs
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}_${{ matrix.arch }}
          path: ddns-rs_*

  publish:
    name: Publish release + Docker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/riscv64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ddns-rs:${{ github.ref_name }}
            ${{ secrets.DOCKER_USERNAME }}/ddns-rs:latest
            ghcr.io/${{ github.repository_owner }}/ddns-rs:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/ddns-rs:latest
