name: openwrt

# Build ddns-rs OpenWrt LuCI packages (.ipk for opkg / .apk for the
# OpenWrt 25.x apk package manager) and attach them to a GitHub release.
# Packages are built with node scripts directly - no OpenWrt SDK cross-build
# environment is required, since both packages are architecture-independent
# (the ddns-rs binary itself is installed via the LuCI "Binary" page).

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build Vue frontend
        run: |
          set -x
          node -v
          npm -v
          cd luci
          npm ci
          npm run build:no-pkg
          test -f luci-app-ddns-rs/htdocs/luci-static/resources/ddns-rs-app/ddns-rs-app.js
          echo "bundle OK"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=0.3.1" >> "$GITHUB_OUTPUT"
            echo "tag=v0.3.1" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build packages and run checks
        run: luci/scripts/release-check.sh "${{ steps.version.outputs.value }}" dist

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            dist/*.ipk
            dist/*.apk
            dist/sha256sums.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
